# Default tex2torsor mappings (format-neutral base). In a torsor deliverable the
# assembler OVERWRITES this with the doc's assembled mappings (core base +
# enabled features, e.g. the callouts feature's notebox/warnbox/pitfallbox). This
# minimal default is only what a bare tex2torsor run would use.
mappings:
  macros:
    code:
      html_tag: code
      classes: []
