# tex2torsor mappings for: thing — A User's Manual
# Used by tex2torsor.py as the default config for this project.
#
# To reuse for a different LaTeX project, copy this file and adjust
# environments/macros to match that project's custom commands.

mappings:
  environments:
    notebox:
      classes: [callout, callout-note]
      label: "Note"
    warnbox:
      classes: [callout, callout-warn]
      label: "Warning"

  macros:
    code:
      html_tag: code
      classes: []

# CSS files to link in output (paths relative to output file, or absolute).
# tex2torsor.py --css flags override this list entirely.
css: []
